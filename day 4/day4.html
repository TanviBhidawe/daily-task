<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >online internship registration form 
    </title>
</head>
<body>
    <form>
    <div>
    <h1>Online Internship Registration Rorm</h1>
    <h2>personal details</h2>
    <input type="text" placeholder="enter your name">
    <br><br>
    <input type="email" placeholder="enter your email">
    <br><br>
    <input type="password" placeholder="enter your password">
    <br><br>
    <input type="tel" placeholder="enter your phone number">
    <br><br>
    <input type="text" placeholder="enter your college name">
    </div>

    <br>
    <hr>
    <div>
    <h2>skills</h2>
    <input type="checkbox" id="html" name="html">
    <label for="html">html</label>
    <br>
    <input type="checkbox" id="css" name="css">
     <label for="css">css</label>
    <br>
    <input type="checkbox" id="java" name="java">
     <label for="java">java</label>
    <br>
    <input type="checkbox" id="python" name="python">
     <label for="python">python</label>
    <br>
    </div>
   <div>
    <hr>
    <h2>Preferred technology</h2>
    <input type="radio" id="frontend" name="web development">
    <label for="web development">web development</label>
    <br>
    <input type="radio" id="backend" name="java fullstack">
    <label for="java fullstack">java fullstack</label>
    <br>
    <input type="radio" id="fronted" name="web devlopment">
    <label for="web devlopment">ui/ux devlopment</label>
    <br>
    <input type="radio" id="fronted and backend" name="android devlopment">
    <label for="android devlopment">android development</label>
   </div>
   <hr>
   <div>
    <h2>project interest</h2>
    <textarea rows="10" cols="15"> enter your project interest here...</textarea>
    <br>

    <input type="checkbox" id="declared">
    <label for="declared">i declare that the above information is true and correct.</label>
   </div>
   <div>
    <button>submit</button>
   </div>
   <hr>
   </form>

    
</body>
</html>
