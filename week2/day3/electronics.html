<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="e-commerce.css">
    <title>Document</title>
</head>
<body>
    <section>
    <h2>Electronics</h2>

    <div class="products">

        <div class="card">
            <span class="offer">40% OFF</span>
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853" alt="Laptop">
            <h3>Laptop</h3>
            <p>₹55,000</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">30% OFF</span>
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Mobile">
            <h3>Smart Phone</h3>
            <p>₹20,000</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">25% OFF</span>
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹2,000</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">15% OFF</span>
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>₹3,500</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">35% OFF</span>
            <img src="https://images.unsplash.com/photo-1541140532154-b024d705b90a" alt="Keyboard">
            <h3>Keyboard</h3>
            <p>₹1,200</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">20% OFF</span>
            <img src="https://images.unsplash.com/photo-1527814050087-3793815479db" alt="Mouse">
            <h3>Mouse</h3>
            <p>₹800</p>
            <button>Buy</button>
        </div>

    </div>
</section>
</body>
</html>
