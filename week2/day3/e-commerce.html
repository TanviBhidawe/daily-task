<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="e-commerce.css">
  <title>E-Commerce Website</title>
</head>
<body>
  <h1>Smart Bazzar</h1>
  <nav class="nav">
    <a href="daily-product">Daily Product</a>
    <a href="grocery.html"> Grocery</a>
    <a href="electronics.html">Electronics</a>
  </nav>


    <header>
        <h1>E-Commerce Store</h1>

        <div class="search-box">
            <input type="text" placeholder="Search products...">
            <button>Search</button>
        </div>
    </header>

    <!-- Daily Items -->
    <section>
        <h2>Daily Items</h2>

        <div class="products">

            <div class="card">
                <span class="offer">20% OFF</span>
                <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff" alt="Bread">
                <h3>Bread</h3>
                <p>₹40</p>
                <button>Buy</button>
            </div>

            <div class="card">
                <span class="offer">15% OFF</span>
                <img src="https://images.unsplash.com/photo-1550583724-b2692b85b150" alt="Milk">
                <h3>Milk</h3>
                <p>₹60</p>
                <button>Buy</button>
            </div>

            <div class="card">
                <span class="offer">10% OFF</span>
                <img src="https://images.unsplash.com/photo-1518569656558-1f25e69d93d7" alt="Eggs">
                <h3>Eggs</h3>
                <p>₹90</p>
                <button>Buy</button>
            </div>

            <div class="card">
                <span class="offer">25% OFF</span>
                <img src="https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d" alt="Butter">
                <h3>Butter</h3>
                <p>₹120</p>
                <button>Buy</button>
            </div>

            <div class="card">
                <span class="offer">30% OFF</span>
                <img src="https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d" alt="Cheese">
                <h3>Cheese</h3>
                <p>₹180</p>
                <button>Buy</button>
            </div>

            <div class="card">
                <span class="offer">12% OFF</span>
                <img src="https://images.unsplash.com/photo-1622484212850-eb596d769edc" alt="browni">
                <h3>browni</h3>
                <p>₹80</p>
                <button>Buy</button>
            </div>

        </div>
    </section>


  
  
</body>
</html>
