<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="e-commerce.css">
    <title>Document</title>
</head>
<body>
    <section>
    <h2>Grocery</h2>

    <div class="products">

        <div class="card">
            <span class="offer">25% OFF</span>
            <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c" alt="Rice"><h3>Rice</h3>
            <p>₹500</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">20% OFF</span>
            <img src="https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b" alt="Wheat">
            <h3>Wheat</h3>
            <p>₹350</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">15% OFF</span>
            <img src="https://t3.ftcdn.net/jpg/02/22/41/82/360_F_222418209_hfwPSMzDi7pZWmCTn9NGdCJ3sijCGuQo.jpg" alt="Sugar">
            <h3>Sugar</h3>
            <p>₹60</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">10% OFF</span>
            <img src="https://t3.ftcdn.net/jpg/01/99/90/94/360_F_199909433_VWfq94a6BYtepSIJczsxykqAYuFVEX1Z.jpg" alt="Salt">
            <h3>Salt</h3>
            <p>₹25</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">30% OFF</span>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBe-4Al3YHk-OHWikU8g5R703kl2AQzUO1nQ&s" alt="Tea">
            <h3>Tea</h3>
            <p>₹150</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <span class="offer">18% OFF</span>
            <img src="https://m.media-amazon.com/images/I/51fO-PwnBLL._AC_UF1000,1000_QL80_.jpg" alt="Coffee">
            <h3>Coffee</h3>
            <p>₹250</p>
            <button>Buy</button>
        </div>

    </div>
</section>
</body>
</html>
