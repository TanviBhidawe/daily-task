<!DOCTYPE html>
<html>

<head>
<title>Student Result Management System</title>
<link rel="stylesheet" href="student.css">
</head>

<body>

<div class="container">

<h1>Student Result Management System</h1>
<h3>Check Your Summer 2026 Result</h3>

<input type="text" id="roll" placeholder="Enter Roll No">
<input type="text" id="name"placeholder="Enter Student Name">
<input type="number" id="java"placeholder="Enter Java Marks">
<input type="number" id="dbms"placeholder="Enter DBMS Marks">
<input type="number" id="dcn"placeholder="Enter DCN Marks">
<input type="number" id="mtc"placeholder="Enter MiC Marks">

<div id="result"></div>
</div>
<script src="student.js"></script>

</body>
</html>
